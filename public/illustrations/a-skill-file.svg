<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="620" viewBox="0 0 1160 620" font-family="Inter, Helvetica, Arial, sans-serif">
  <rect width="1160" height="620" fill="#ffffff"/>
  <g transform="translate(60,30)">
    <rect width="560" height="560" rx="12" fill="#ffffff" stroke="#DCE3DF" stroke-width="1.5"/>
    <rect width="560" height="36" rx="12" fill="#F3F6F4"/><rect y="24" width="560" height="12" fill="#F3F6F4"/>
    <text x="18" y="24" font-size="13" font-family="Menlo, Consolas, monospace" fill="#5B6663">check-the-facts.md</text>
    <g font-family="Menlo, Consolas, monospace" font-size="13" fill="#17201F">
      <text x="24" y="70" font-weight="700"># Check the facts before I send</text>
      <text x="24" y="94" fill="#3B4543">Run it on anything with a number, a name,</text>
      <text x="24" y="112" fill="#3B4543">a date, or a quote in it, before I read it.</text>
      <text x="24" y="150" font-weight="700">## What I send that has to be right</text>
      <text x="24" y="172" fill="#1F5F4A">Client memos. Board reports.</text>
      <text x="24" y="210" font-weight="700">## Check every one of these</text>
      <text x="24" y="232" fill="#3B4543">1. Numbers: a named source and a date.</text>
      <text x="24" y="250" fill="#3B4543">2. The one the argument turns on: check twice.</text>
      <text x="24" y="268" fill="#3B4543">3. Names and titles: current, spelled right.</text>
      <text x="24" y="286" fill="#3B4543">...</text>
      <text x="24" y="304" fill="#3B4543">7. "Says" and "requires": the source says that.</text>
      <text x="24" y="342" font-weight="700">## Rules</text>
      <text x="24" y="364" fill="#3B4543">- "Couldn't find" is a valid answer.</text>
      <text x="24" y="382" fill="#3B4543">- Don't rewrite anything except what's flagged.</text>
      <text x="24" y="400" fill="#3B4543">- Any source you can't open is not a source.</text>
      <text x="24" y="438" font-weight="700">## Corrections</text>
      <text x="24" y="460" fill="#1F5F4A">- Oct 20: proposal date, not the final rule</text>
      <text x="24" y="478" fill="#1F5F4A">- Oct 24: our client's title changed in May</text>
      <text x="24" y="520" fill="#C9CFCC">-</text>
    </g>
  </g>
  <g font-size="14" fill="#17201F">
    <g transform="translate(680,60)"><circle r="12" fill="#1F5F4A"/><text x="-4" y="5" font-size="12" font-weight="700" fill="#fff">1</text><text x="24" y="5" font-weight="600">This is the job</text><text x="24" y="26" font-size="13" fill="#3B4543">One sentence. When it runs and on what.</text><path d="M-16 0 L-50 20" stroke="#1F5F4A" stroke-width="1.5" fill="none"/></g>
    <g transform="translate(680,170)"><circle r="12" fill="#1F5F4A"/><text x="-4" y="5" font-size="12" font-weight="700" fill="#fff">2</text><text x="24" y="5" font-weight="600">Your three answers</text><text x="24" y="26" font-size="13" fill="#3B4543">The only part you filled in. In green.</text><path d="M-16 0 L-50 -2" stroke="#1F5F4A" stroke-width="1.5" fill="none"/></g>
    <g transform="translate(680,270)"><circle r="12" fill="#1F5F4A"/><text x="-4" y="5" font-size="12" font-weight="700" fill="#fff">3</text><text x="24" y="5" font-weight="600">The steps, written once</text><text x="24" y="26" font-size="13" fill="#3B4543">What it does every time. You never type this again.</text><path d="M-16 0 L-50 -8" stroke="#1F5F4A" stroke-width="1.5" fill="none"/></g>
    <g transform="translate(680,390)"><circle r="12" fill="#1F5F4A"/><text x="-4" y="5" font-size="12" font-weight="700" fill="#fff">4</text><text x="24" y="5" font-weight="600">What it must never do</text><text x="24" y="26" font-size="13" fill="#3B4543">The lines that keep it from being helpful in the wrong direction.</text><path d="M-16 0 L-50 -16" stroke="#1F5F4A" stroke-width="1.5" fill="none"/></g>
    <g transform="translate(680,490)"><circle r="12" fill="#1F5F4A"/><text x="-4" y="5" font-size="12" font-weight="700" fill="#fff">5</text><text x="24" y="5" font-weight="600">Where your corrections go</text><text x="24" y="26" font-size="13" fill="#3B4543">One line each time it gets something wrong. Why it gets better.</text><path d="M-16 0 L-50 -16" stroke="#1F5F4A" stroke-width="1.5" fill="none"/></g>
  </g>
</svg>
